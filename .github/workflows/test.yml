name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: run tests
        run: python -m unittest discover -s tests -v
      - name: run the example
        run: |
          python -m robotscheck lint tests/data/example.txt --strict
          python -m robotscheck bots tests/data/ai_policy.txt --policy search=allow
          python -m robotscheck signals tests/data/signals.txt --agent '*' --agent ClaudeBot --expect ai-train=no
